[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mubu-exporter"
version = "0.1.0"
description = "Reliable Mubu backups and rich-text outline to Markdown conversion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hokkaido"}]
dependencies = ["requests>=2.31,<3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1,<2", "markdown-it-py>=3,<4", "PyYAML>=6,<7"]

[project.scripts]
mubu-export = "mubu_exporter.cli:main"

[project.urls]
Repository = "https://github.com/Hokkaidoooo/mubu-exporter"
Issues = "https://github.com/Hokkaidoooo/mubu-exporter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
